[package]
name = "suxel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generic, agent-framework-agnostic durable execution runtime for tool-using agents."

[features]
# Reusable mock drivers + backend conformance scenarios (see `testkit`).
# Enable under `[dev-dependencies]` in storage-backend crates to run the shared suite.
testkit = []

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "test-util"] }
