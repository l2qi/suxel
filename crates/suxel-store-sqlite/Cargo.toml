[package]
name = "suxel-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLite storage backend for the Suxel durable execution runtime."

[dependencies]
suxel-core = { path = "../suxel-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }

[dev-dependencies]
suxel-core = { path = "../suxel-core", features = ["testkit"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
tempfile = { workspace = true }
